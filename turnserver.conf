# =====================================================================
# Coturn TURN Server Production Configuration
# =====================================================================
# Coturn provides guaranteed WebRTC relaying across cellular Carrier-Grade NAT
# (Symmetric NAT) when Android devices connect over 4G/5G mobile networks.

# Standard STUN/TURN listening port (UDP and TCP)
listening-port=3478

# Encrypted TURN over TLS port (optional, requires SSL certs)
# tls-listening-port=5349

# Authentication Realm (use your server domain or public IP)
realm=turn.yourdomain.com

# Enable long-term credential mechanism for WebRTC clients
lt-cred-mech

# Static authentication credentials for watch party participants
# Format: user=<username>:<password>
user=watchparty_guest:replace_with_strong_turn_password

# Port range for TURN relay media allocations (ensure open in VPS firewall)
min-port=49152
max-port=49250

# Security and hygiene options
fingerprint
no-cli
no-multicast
no-loopback-peers
stale-nonce=600

# Logging to standard output for Docker log collectors
log-file=stdout
verbose
